<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>shakespeare prose.</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
      padding: 20px;
      min-height: 100vh;
    }

    h1 {
      font-size: 14px;
      font-weight: 600;
      color: #8888aa;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 16px;
    }

    #loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 0;
      gap: 16px;
    }

    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid #333;
      border-top-color: #6c63ff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    #loading p {
      font-size: 14px;
      color: #8888aa;
    }

    #error {
      display: none;
      background: #3a1a1a;
      border: 1px solid #6b2a2a;
      border-radius: 8px;
      padding: 16px;
      color: #ff8888;
      font-size: 14px;
      line-height: 1.5;
    }

    #error h2 {
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 8px;
      color: #ff6666;
    }

    #result {
      display: none;
    }

    .section {
      margin-bottom: 16px;
    }

    .section-label {
      font-size: 11px;
      font-weight: 600;
      color: #6c63ff;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
      display: inline;
    }

    .retry-icon {
      display: none;
      margin-left: 6px;
      font-size: 13px;
      cursor: pointer;
      color: #6c63ff;
      vertical-align: middle;
      transition: color 0.15s, transform 0.15s;
    }

    .retry-icon:hover {
      color: #aaffaa;
      transform: rotate(90deg);
    }

    .retry-icon.show {
      display: inline;
    }

    .latency {
      display: none;
      margin-left: 6px;
      font-size: 10px;
      color: #666;
      font-family: monospace;
      vertical-align: middle;
    }

    .latency.show {
      display: inline;
    }

    .tokens {
      display: none;
      margin-left: 6px;
      font-size: 10px;
      color: #666;
      font-family: monospace;
      vertical-align: middle;
    }

    .tokens.show {
      display: inline;
    }

    .section-error {
      color: #ff8888;
      font-size: 13px;
      font-style: italic;
    }

    .section-content {
      background: #16213e;
      border: 1px solid #2a2a4a;
      border-radius: 8px;
      padding: 14px;
      font-size: 14px;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .section-content.original {
      color: #aaaacc;
      text-decoration: line-through;
      text-decoration-color: #665566;
    }

    .section-content.corrected {
      color: #aaffaa;
      border-color: #2a4a2a;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
    }

    .section-content.corrected.copied {
      border-color: #4caf50;
      background: #1a2e1a;
    }

    .section-content.suggested {
      color: #aaddff;
      border-color: #2a3a5a;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
    }

    .section-content.suggested.copied {
      border-color: #4caf50;
      background: #1a2e2a;
    }

    .streaming-indicator {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 0;
    }

    .streaming-indicator.hidden {
      display: none;
    }

    .streaming-indicator span {
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #6c63ff;
      animation: bounce 1.2s ease-in-out infinite;
    }

    .streaming-indicator span:nth-child(2) {
      animation-delay: 0.15s;
    }

    .streaming-indicator span:nth-child(3) {
      animation-delay: 0.3s;
    }

    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
      30% { transform: translateY(-6px); opacity: 1; }
    }

    .settings-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      background: #16213e;
      border: 1px solid #2a2a4a;
      border-radius: 8px;
      margin-bottom: 16px;
    }

    .settings-bar label {
      font-size: 11px;
      font-weight: 600;
      color: #6c63ff;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }

    .settings-bar input {
      flex: 1;
      background: #1a1a2e;
      border: 1px solid #2a2a4a;
      border-radius: 4px;
      padding: 4px 8px;
      color: #e0e0e0;
      font-size: 12px;
      font-family: monospace;
      outline: none;
      transition: border-color 0.15s;
    }

    .settings-bar input:focus {
      border-color: #6c63ff;
    }

    .api-settings {
      display: none;
      gap: 8px;
      padding: 10px 12px;
      background: #16213e;
      border: 1px solid #2a2a4a;
      border-radius: 8px;
      margin-bottom: 16px;
    }

    .settings-mode .api-settings {
      display: grid;
    }

    .api-settings-title {
      color: #8888aa;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .api-settings-grid {
      display: grid;
      grid-template-columns: repeat(10, minmax(0, 1fr));
      gap: 8px;
    }

    .api-setting {
      display: grid;
      gap: 3px;
      min-width: 0;
    }

    .api-setting.model {
      grid-column: span 5;
    }

    .api-setting:not(.model) {
      grid-column: span 2;
    }

    .api-setting label {
      color: #8888aa;
      font-size: 10px;
    }

    .api-setting input {
      width: 100%;
      background: #1a1a2e;
      border: 1px solid #2a2a4a;
      border-radius: 4px;
      padding: 4px 6px;
      color: #e0e0e0;
      font-size: 11px;
      font-family: monospace;
      outline: none;
    }

    .api-setting input:focus {
      border-color: #6c63ff;
    }

    .api-settings-hint {
      color: #666;
      font-size: 10px;
    }

    .prompt-settings {
      display: none;
      gap: 8px;
      padding: 10px 12px;
      background: #16213e;
      border: 1px solid #2a2a4a;
      border-radius: 8px;
      margin-bottom: 16px;
    }

    .settings-mode .prompt-settings {
      display: grid;
    }

    .extension-version {
      display: none;
      color: #8888aa;
      font-size: 11px;
      text-align: right;
    }

    .settings-mode .extension-version {
      display: block;
    }

    .prompt-settings-title {
      color: #8888aa;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .prompt-actions {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .prompt-edit-button {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-width: 0;
      padding: 12px;
      background: #1a1a2e;
      border: 1px solid #2a2a4a;
      border-radius: 6px;
      color: #e0e0e0;
      cursor: pointer;
      text-align: left;
      transition: background 0.15s, border-color 0.15s;
    }

    .prompt-edit-button:hover {
      background: #20203a;
      border-color: #6c63ff;
    }

    .prompt-edit-name {
      font-size: 12px;
      font-weight: 600;
    }

    .prompt-edit-status {
      color: #8888aa;
      font-size: 10px;
      white-space: nowrap;
    }

    dialog {
      width: min(760px, calc(100vw - 40px));
      max-height: calc(100vh - 40px);
      margin: auto;
      padding: 0;
      background: #1a1a2e;
      border: 1px solid #2a2a4a;
      border-radius: 10px;
      color: #e0e0e0;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
    }

    dialog::backdrop {
      background: rgba(7, 7, 18, 0.75);
    }

    .prompt-dialog-form {
      display: grid;
      gap: 16px;
      padding: 20px;
    }

    .prompt-dialog-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .prompt-dialog-header h2 {
      font-size: 16px;
    }

    .prompt-dialog-close {
      width: 32px;
      height: 32px;
      background: transparent;
      border: 1px solid #3a3a5a;
      border-radius: 6px;
      color: #aaaacc;
      cursor: pointer;
      font-size: 20px;
      line-height: 1;
    }

    .prompt-dialog-field {
      display: grid;
      gap: 8px;
    }

    .prompt-dialog-field label {
      color: #8888aa;
      font-size: 12px;
      font-weight: 600;
    }

    #prompt-dialog-text {
      width: 100%;
      min-height: 360px;
      resize: vertical;
      background: #111126;
      border: 1px solid #3a3a5a;
      border-radius: 6px;
      padding: 12px;
      color: #e0e0e0;
      font: 12px/1.5 monospace;
    }

    .prompt-dialog-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
    }

    .prompt-dialog-actions button {
      padding: 8px 12px;
      border: 1px solid #3a3a5a;
      border-radius: 6px;
      background: #20203a;
      color: #e0e0e0;
      cursor: pointer;
      font-weight: 600;
    }

    .prompt-dialog-actions .use-default {
      margin-right: auto;
    }

    .prompt-dialog-actions .primary {
      background: #6c63ff;
      border-color: #6c63ff;
      color: #fff;
    }

    :where(button, input, textarea):focus-visible {
      outline: 2px solid #a9a4ff;
      outline-offset: 2px;
    }

    @media (max-width: 700px) {
      .api-settings-grid,
      .prompt-actions {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .api-setting,
      .api-setting.model {
        grid-column: span 1;
      }

      .api-setting.model {
        grid-column: 1 / -1;
      }
    }

    .checkmark {
      opacity: 0;
      visibility: hidden;
      color: #4caf50;
      font-size: 16px;
      font-weight: 700;
      transition: opacity 0.2s, visibility 0.2s;
    }

    .checkmark.show {
      opacity: 1;
      visibility: visible;
    }

    .health-dot {
      display: none;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      vertical-align: middle;
    }

    .health-dot.ok {
      display: inline-block;
      background: #4caf50;
    }

    .health-dot.fail {
      display: inline-block;
      background: #ff5555;
    }

    .lang-toggle {
      display: flex;
      margin-left: auto;
      border: 1px solid #2a2a4a;
      border-radius: 4px;
      overflow: hidden;
    }

    .lang-btn {
      background: #1a1a2e;
      border: none;
      padding: 3px 8px;
      font-size: 11px;
      font-weight: 600;
      color: #888;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }

    .lang-btn + .lang-btn {
      border-left: 1px solid #2a2a4a;
    }

    .lang-btn.active {
      background: #6c63ff;
      color: #fff;
    }

    .lang-btn:hover:not(.active) {
      background: #2a2a4a;
      color: #ccc;
    }

    .open-settings-button {
      padding: 4px 10px;
      background: #6c63ff;
      border: 1px solid #6c63ff;
      border-radius: 4px;
      color: #fff;
      cursor: pointer;
      font-size: 11px;
      font-weight: 600;
    }

    .open-settings-button:hover {
      background: #7b73ff;
    }

    .settings-mode .open-settings-button {
      display: none;
    }
  </style>
</head>
<body>
  <div class="settings-bar">
    <label for="api-url">API</label>
    <input type="text" id="api-url" placeholder="http://127.0.0.1:8888" spellcheck="false">
    <span id="api-saved" class="checkmark">&#10003;</span>
    <span id="health-dot" class="health-dot"></span>
    <div class="lang-toggle">
      <button id="lang-en" class="lang-btn active" type="button">EN</button>
      <button id="lang-fr" class="lang-btn" type="button">FR</button>
    </div>
    <button id="open-settings" class="open-settings-button" type="button">Open settings</button>
  </div>
  <div class="api-settings">
    <div class="api-settings-title">Chat completion settings</div>
    <div class="api-settings-grid">
      <div class="api-setting model">
        <label for="api-model">Model (optional)</label>
        <input type="text" id="api-model" placeholder="Use the server's loaded model" spellcheck="false">
      </div>
      <div class="api-setting model">
        <label for="api-key">API key (optional)</label>
        <input type="password" id="api-key" placeholder="Leave blank for keyless APIs" autocomplete="off" spellcheck="false">
      </div>
      <div class="api-setting">
        <label for="api-temperature">Temperature</label>
        <input type="number" id="api-temperature" min="0" max="2" step="0.05">
      </div>
      <div class="api-setting">
        <label for="api-max-tokens">Max tokens</label>
        <input type="number" id="api-max-tokens" min="1" max="32768" step="1">
      </div>
      <div class="api-setting">
        <label for="api-top-p">Top P</label>
        <input type="number" id="api-top-p" min="0" max="1" step="0.05">
      </div>
      <div class="api-setting">
        <label for="api-frequency-penalty">Frequency penalty</label>
        <input type="number" id="api-frequency-penalty" min="-2" max="2" step="0.05">
      </div>
      <div class="api-setting">
        <label for="api-presence-penalty">Presence penalty</label>
        <input type="number" id="api-presence-penalty" min="-2" max="2" step="0.05">
      </div>
    </div>
    <div class="api-settings-hint">Leave Model blank to use the server's loaded model. Add an API key when the server requires Bearer authentication.</div>
  </div>
  <section class="prompt-settings" aria-labelledby="prompt-settings-title">
    <h2 id="prompt-settings-title" class="prompt-settings-title">Prompt overrides</h2>
    <div class="prompt-actions">
      <button id="edit-prompt-en-correct" class="prompt-edit-button" type="button">
        <span class="prompt-edit-name">English correction</span>
        <span class="prompt-edit-status">Default prompt</span>
      </button>
      <button id="edit-prompt-en-suggest" class="prompt-edit-button" type="button">
        <span class="prompt-edit-name">English suggestion</span>
        <span class="prompt-edit-status">Default prompt</span>
      </button>
      <button id="edit-prompt-fr-correct" class="prompt-edit-button" type="button">
        <span class="prompt-edit-name">French correction</span>
        <span class="prompt-edit-status">Default prompt</span>
      </button>
      <button id="edit-prompt-fr-suggest" class="prompt-edit-button" type="button">
        <span class="prompt-edit-name">French suggestion</span>
        <span class="prompt-edit-status">Default prompt</span>
      </button>
    </div>
  </section>
  <footer class="extension-version">Shakespeare version <span id="extension-version"></span></footer>
  <dialog id="prompt-dialog" closedby="any" aria-labelledby="prompt-dialog-title">
    <form id="prompt-dialog-form" class="prompt-dialog-form" method="dialog">
      <div class="prompt-dialog-header">
        <h2 id="prompt-dialog-title"></h2>
        <button id="prompt-dialog-close" class="prompt-dialog-close" type="button" aria-label="Close prompt editor">&times;</button>
      </div>
      <div class="prompt-dialog-field">
        <label for="prompt-dialog-text">Prompt</label>
        <textarea id="prompt-dialog-text" spellcheck="false"></textarea>
      </div>
      <div class="prompt-dialog-actions">
        <button id="prompt-use-default" class="use-default" type="button">Use default</button>
        <button id="prompt-dialog-cancel" type="button">Cancel</button>
        <button class="primary" type="submit">Save prompt</button>
      </div>
    </form>
  </dialog>
  <div id="loading">
    <div class="spinner"></div>
    <p>Correcting text...</p>
  </div>

  <div id="error">
    <h2>Error</h2>
    <p id="error-message"></p>
  </div>

  <div id="result">
    <div class="section">
      <div class="section-label">Original</div>
      <div class="section-content original" id="original-text"></div>
    </div>
    <div class="section">
      <div class="section-header">
        <span class="section-label">Corrected</span>
        <span class="retry-icon" id="retry-corrected">&#8635;</span>
        <span class="latency" id="latency-corrected"></span>
        <span class="tokens" id="tokens-corrected"></span>
      </div>
      <div class="section-content corrected" id="corrected-text">
        <div id="corrected-indicator" class="streaming-indicator hidden">
          <span></span><span></span><span></span>
        </div>
      </div>
    </div>
    <div class="section">
      <div class="section-header">
        <span class="section-label">Suggested</span>
        <span class="retry-icon" id="retry-suggested">&#8635;</span>
        <span class="latency" id="latency-suggested"></span>
        <span class="tokens" id="tokens-suggested"></span>
      </div>
      <div class="section-content suggested" id="suggested-text">
        <div id="suggested-indicator" class="streaming-indicator hidden">
          <span></span><span></span><span></span>
        </div>
      </div>
    </div>
  </div>

  <script src="result.js"></script>
</body>
</html>
