name: Validate and package

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.3.11
      - name: Validate and package
        shell: bash
        run: |
          bun ci
          bun run check
          bun run typecheck
          bun run build
          bun run verify
          bun run package
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: shakespeare-extension
          path: artifacts/*.zip
          if-no-files-found: error
